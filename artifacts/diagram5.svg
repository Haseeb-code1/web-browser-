<line x1="390" y1="75" x2="390" y2="470" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,4" />
<rect x="348" y="470" width="84" height="25" fill="#2d1f10" stroke="#d97706" stroke-width="1" rx="0" ry="0" />
