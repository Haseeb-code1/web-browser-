<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
<style>
    text { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
    .title { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .stereotype { font-size: 10px; fill: #94a3b8; font-style: italic; }
    .class-header { font-size: 11px; font-weight: bold; fill: #ffffff; }
    .arrow-label { font-size: 9px; fill: #94a3b8; }
</style>
<defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="inheritance" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <path d="M 2 1 L 9 5 L 2 9 Z" fill="#0f111a" stroke="#94a3b8" stroke-width="1"/>
    </marker>
    <marker id="composition" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M 2 6 L 6 2 L 10 6 L 6 10 Z" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/>
    </marker>
</defs>
<rect width="100%" height="100%" fill="#0f111a" stroke="#1e293b" stroke-width="1"/>
<text x="20" y="25" class="title">Diagram 5 — AI Agent Task Flow Sequence Diagram</text>
