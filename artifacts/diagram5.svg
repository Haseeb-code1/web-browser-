<line x1="580" y1="75" x2="580" y2="470" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,4" />
<rect x="538" y="470" width="84" height="25" fill="#2d1f10" stroke="#d97706" stroke-width="1" rx="0" ry="0" />
<text x="580" y="486" class="class-header" text-anchor="middle">PageReader</text>
<rect x="100" y="90" width="10" height="360" fill="#1e293b" stroke="#94a3b8" stroke-width="0.5" rx="0" ry="0" />
<rect x="195" y="110" width="10" height="330" fill="#1e293b" stroke="#94a3b8" stroke-width="0.5" rx="0" ry="0" />
<rect x="290" y="130" width="10" height="260" fill="#1e293b" stroke="#94a3b8" stroke-width="0.5" rx="0" ry="0" />
<rect x="480" y="220" width="10" height="130" fill="#1e293b" stroke="#94a3b8" stroke-width="0.5" rx="0" ry="0" />
<line x1="40" y1="95" x2="100" y2="95" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="72.5" y="90" class="" text-anchor="middle">submit task text</text>
<line x1="110" y1="115" x2="195" y2="115" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="152.5" y="110" class="" text-anchor="middle">run_task(task)</text>
<line x1="205" y1="135" x2="290" y2="135" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="247.5" y="130" class="" text-anchor="middle">spawn(task)</text>
<rect x="10" y="160" width="660" height="240" fill="none" stroke="#334155" stroke-width="0.8" rx="0" ry="0" stroke-dasharray="2,2" />
<text x="15" y="172" class="stereotype">loop [max 10 steps or until tool == 'answer']</text>
<line x1="300" y1="190" x2="388" y2="190" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="342.5" y="185" class="" text-anchor="middle">chat(history + tools)</text>
<line x1="388" y1="210" x2="300" y2="210" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
<text x="342.5" y="205" class="" text-anchor="middle">{"tool":...}</text>
<line x1="290" y1="230" x2="205" y2="230" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="247.5" y="225" class="" text-anchor="middle">action_ready()</text>
<line x1="205" y1="250" x2="480" y2="250" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="342.5" y="245" class="" text-anchor="middle">execute(action)</text>
<line x1="490" y1="275" x2="578" y2="275" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="532.5" y="270" class="" text-anchor="middle">extract_dom()</text>
<line x1="578" y1="300" x2="490" y2="300" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
<text x="532.5" y="295" class="" text-anchor="middle">dom_state</text>
<line x1="480" y1="325" x2="205" y2="325" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
<text x="342.5" y="320" class="" text-anchor="middle">result</text>
<line x1="205" y1="350" x2="215" y2="350" stroke="#94a3b8" stroke-width="0.5" />
<line x1="215" y1="350" x2="215" y2="370" stroke="#94a3b8" stroke-width="0.5" />
<line x1="215" y1="370" x2="205" y2="370" stroke="#94a3b8" stroke-width="0.5" marker-end="url(#arrow)" />
<text x="220" y="363" class="">append history</text>
<line x1="195" y1="420" x2="110" y2="420" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
<text x="152.5" y="415" class="" text-anchor="middle">final_answer</text>
<line x1="100" y1="445" x2="40" y2="445" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
<text x="72.5" y="440" class="" text-anchor="middle">display answer</text>
</svg>